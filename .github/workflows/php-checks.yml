name: PHP Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          
      - name: Check PHP syntax
        run: |
          ERRORS=$(find . -name '*.php' -not -path './vendor/*' -exec php -l {} \; | grep -v 'No syntax errors' || true)
          
          if [ -n "$ERRORS" ]; then
            echo "Found syntax errors:"
            echo "$ERRORS"
            exit 1
          fi
          
          echo 'All PHP files passed syntax check!'

  phpcs:
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP with PHPCS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: phpcs
          
      - name: Run PHPCS
        run: |
          phpcs --standard=PSR12 --extensions=php \
            --ignore=vendor/,node_modules/ .
          echo 'Code style check completed!'
